; PHP Configuration for Emergency Desk
; Uploadowanie zdjęć i plików

; Maximum size of POST data that PHP will accept
; Zwiększone z 8M na 50M aby obsługiwać wiele zdjęć na raz
post_max_size = 50M

; Maximum allowed size of an uploaded file
; Zwiększone z 2M na 10M aby obsługiwać normalne zdjęcia z telefonów
upload_max_filesize = 10M

; Memory limit dla przetwarzania dużych plików
memory_limit = 256M

; Timeout dla długotrwałych operacji
max_execution_time = 60

; Nesting level dla array'ów w POST data
max_input_nesting_level = 64
